openapi: 3.0.3
info:
  title: University Library Management API
  version: 0.2.0
  description: >
    Library catalog and circulation API. Authentication uses HttpOnly cookies
    (`udis_at` access token, `udis_rt` refresh token). Mutations additionally
    require the `X-CSRF-Token` header matching the readable `udis_csrf` cookie.
servers:
  - url: http://localhost:5000/api
tags:
  - name: Auth
  - name: Students
  - name: Analytics
  - name: Integration
  - name: Alumni
  - name: Admin
  - name: Library
paths:
  /library/books:
    get:
      tags: [Library]
      summary: List catalog books, including cover_url
      responses:
        "200":
          description: Catalog books
    post:
      tags: [Library]
      summary: Add a book (Administrator or Librarian)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryBookInput"
      responses:
        "201":
          description: Book created with an automatically looked-up or manually supplied cover_url
        "400":
          description: Invalid book data
        "401":
          description: Authentication required
        "403":
          description: Administrator or Librarian role required
  /library/books/cover-lookup:
    post:
      tags: [Library]
      summary: Look up a cover for the book form (Administrator or Librarian)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isbn: { type: string }
                title: { type: string }
                author: { type: string }
      responses:
        "200":
          description: Cover lookup result (cover_url may be null)
  /library/books/{id}:
    put:
      tags: [Library]
      summary: Edit a book (Administrator or Librarian)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryBookInput"
      responses:
        "200":
          description: Updated book
        "404":
          description: Book not found
  /library/books/{id}/refresh-cover:
    post:
      tags: [Library]
      summary: Re-run cover lookup and save the result (Administrator or Librarian)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Updated book and cover_url result
        "404":
          description: Book not found
  /library/fines/{id}/pay:
    put:
      tags: [Library]
      summary: Record payment for a fine (Administrator or Librarian)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Fine payment recorded
        "401":
          description: Authentication required
        "403":
          description: Administrator or Librarian role required
        "404":
          description: Fine not found
  /auth/register:
    post:
      tags: [Auth]
      summary: Create a student account
      description: Creates an active student profile and account. Requires the database to be enabled.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, name, email, password, programCode, yearLevel]
              properties:
                studentId:
                  type: string
                  maxLength: 32
                name:
                  type: string
                  maxLength: 160
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 12
                programCode:
                  type: string
                  enum: [BSIT, BSCS, BSBA, BSN, BSCE, BSED]
                yearLevel:
                  type: string
                  enum: ["1st Year", "2nd Year", "3rd Year", "4th Year", Graduate]
      responses:
        "201":
          description: Student account created
        "400":
          description: Invalid registration details or program
        "409":
          description: Email address or student ID is already registered
        "429":
          description: Too many registration attempts
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in and set session cookies
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier:
                  type: string
                  description: Email address or user ID
                password:
                  type: string
                rememberMe:
                  type: boolean
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/SessionUser"
                  csrfToken:
                    type: string
        "401":
          description: Invalid credentials
        "429":
          description: Too many attempts
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Email a password reset link when an active account matches
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "202":
          description: Request accepted without disclosing whether the email is registered
        "429":
          description: Too many reset requests
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password with a one-time reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 12
      responses:
        "200":
          description: Password updated and existing refresh sessions revoked
        "400":
          description: Invalid or expired reset token
        "429":
          description: Too many reset requests
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the refresh token
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Rotated session
        "401":
          description: Invalid, expired, or reused session
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the refresh token and clear cookies
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Signed out
  /auth/me:
    get:
      tags: [Auth]
      summary: Current session user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/SessionUser"
        "401":
          description: Not authenticated
  /students:
    get:
      tags: [Students]
      summary: List students
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: program
          schema: { type: string }
        - in: query
          name: yearLevel
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: riskLevel
          schema: { type: string }
      responses:
        "200":
          description: Student list
  /students/{id}:
    get:
      tags: [Students]
      summary: Get a student profile
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Student profile
        "404":
          description: Not found
  /lifecycle:
    get:
      tags: [Students]
      summary: Student lifecycle stages
      responses:
        "200":
          description: Lifecycle overview
  /analytics:
    get:
      tags: [Analytics]
      summary: Academic analytics
      responses:
        "200":
          description: Analytics payload
  /analytics/dashboard:
    get:
      tags: [Analytics]
      summary: Dashboard analytics and recent activity
      responses:
        "200":
          description: Dashboard payload
  /programs:
    get:
      tags: [Analytics]
      summary: Program statistics
      responses:
        "200":
          description: Programs
  /courses:
    get:
      tags: [Analytics]
      summary: Course catalog
      responses:
        "200":
          description: Courses
  /reports:
    get:
      tags: [Analytics]
      summary: Report catalog
      responses:
        "200":
          description: Reports
  /data-sources:
    get:
      tags: [Integration]
      summary: List integrated data sources
      responses:
        "200":
          description: Data sources
  /data-sources/{id}/sync:
    post:
      tags: [Integration]
      summary: Trigger a simulated connector sync (Administrator)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Sync result
        "403":
          description: Forbidden
        "404":
          description: Unknown data source
  /integrations:
    get:
      tags: [Integration]
      summary: Integration summary and sync logs
      responses:
        "200":
          description: Integration status
  /notifications:
    get:
      tags: [Integration]
      summary: Notification feed
      responses:
        "200":
          description: Notifications
  /alumni:
    get:
      tags: [Alumni]
      summary: Alumni records and analytics
      responses:
        "200":
          description: Alumni overview
  /alumni/integrated:
    get:
      tags: [Alumni]
      summary: Integrated Alumni CRM records
      responses:
        "200":
          description: Integrated records
  /alumni/sync:
    post:
      tags: [Alumni]
      summary: Trigger a simulated Alumni CRM sync (Administrator)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Sync result
        "403":
          description: Forbidden
  /admin/dashboard:
    get:
      tags: [Admin]
      summary: Admin overview (Administrator)
      responses:
        "200":
          description: Admin dashboard
  /admin/users:
    get:
      tags: [Admin]
      summary: Portal users (Administrator)
      responses:
        "200":
          description: Users
  /admin/sync-history:
    get:
      tags: [Admin]
      summary: Sync history (Administrator)
      responses:
        "200":
          description: Sync history
  /health:
    get:
      tags: [Auth]
      summary: Service and database health
      security: []
      responses:
        "200":
          description: Healthy
        "503":
          description: Degraded
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: udis_at
  parameters:
    CsrfHeader:
      in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
  schemas:
    LibraryBookInput:
      type: object
      required:
        - isbn
        - title
        - author
        - publisher
        - publicationYear
        - category
        - callNumber
        - totalCopies
        - availableCopies
        - location
      properties:
        isbn: { type: string, maxLength: 32 }
        title: { type: string, maxLength: 200 }
        author: { type: string, maxLength: 160 }
        publisher: { type: string, maxLength: 160 }
        publicationYear: { type: integer, minimum: 0, maximum: 3000 }
        category: { type: string, maxLength: 80 }
        callNumber: { type: string, maxLength: 64 }
        totalCopies: { type: integer, minimum: 1 }
        availableCopies: { type: integer, minimum: 0 }
        location: { type: string, maxLength: 80 }
        cover_url: { type: string, format: uri, nullable: true }
    SessionUser:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role:
          type: string
          enum: [Administrator, Librarian]
        accessRole: { type: string }
        department: { type: string }
        lastLogin: { type: string }
security:
  - cookieAuth: []
